<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>BruchFit – Bruchrechnung lernen</title>
<style>
:root{
  --bg:#0b1020;
  --panel:#141b31;
  --panel2:#1a2340;
  --text:#f8fafc;
  --muted:#a8b2c7;
  --good:#49d17d;
  --bad:#ff6b6b;
  --accent:#5ea7ff;
  --accent2:#8b7cff;
  --gold:#ffd166;
  --shadow:0 16px 40px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 15% 10%,rgba(94,167,255,.18),transparent 30%),
radial-gradient(circle at 85% 15%,rgba(139,124,255,.16),transparent 28%),
linear-gradient(180deg,#0a0f1f,#0e1528 55%,#0a1020);
color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{width:min(980px,100%);margin:auto;padding:16px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:-.04em}
.badge{margin-left:auto;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);font-size:12px}
.card{background:linear-gradient(180deg,rgba(26,35,64,.96),rgba(17,24,45,.96));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);border-radius:24px}
.start{padding:22px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:.95;margin:0 0 12px;letter-spacing:-.06em}
.hero p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 20px}
.heroArt{min-height:250px;display:grid;place-items:center}
.miniPizza{width:min(280px,70vw);aspect-ratio:1;border-radius:50%;position:relative;background:
radial-gradient(circle at 36% 28%,#ffe06b 0 3%,transparent 3.5%),
radial-gradient(circle at 67% 27%,#dc5f4f 0 5%,transparent 5.5%),
radial-gradient(circle at 64% 63%,#dc5f4f 0 5%,transparent 5.5%),
radial-gradient(circle at 34% 68%,#dc5f4f 0 5%,transparent 5.5%),
radial-gradient(circle at 50% 50%,#f6c94a 0 67%,#c9862e 68% 78%,#9b6125 79%);
box-shadow:inset -14px -18px 24px rgba(121,70,20,.35),0 22px 30px rgba(0,0,0,.28);transform:rotate(-6deg)}
.miniPizza:before,.miniPizza:after{content:"";position:absolute;inset:8%;border-radius:50%;pointer-events:none}
.miniPizza:before{background:linear-gradient(90deg,transparent 49.2%,rgba(255,255,255,.8) 49.5% 50.5%,transparent 50.8%)}
.miniPizza:after{background:linear-gradient(0deg,transparent 49.2%,rgba(255,255,255,.8) 49.5% 50.5%,transparent 50.8%)}
.sectionTitle{font-weight:800;margin:18px 0 10px}
.modeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border:none;color:white;background:rgba(255,255,255,.07);padding:15px;border-radius:18px;text-align:left;min-height:86px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.mode.active{background:linear-gradient(135deg,rgba(94,167,255,.28),rgba(139,124,255,.25));box-shadow:inset 0 0 0 2px rgba(94,167,255,.75)}
.mode b{display:block;margin-bottom:5px}.mode small{color:var(--muted);line-height:1.3}
.primary,.secondary{border:none;border-radius:18px;padding:16px 20px;font-weight:850;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 10px 25px rgba(94,167,255,.25)}
.secondary{background:rgba(255,255,255,.08);color:white}
.startBtn{width:100%;margin-top:18px;font-size:18px}
.hidden{display:none!important}
.game{padding:16px}
.status{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.back{width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.08);color:white;font-size:20px}
.progressWrap{height:12px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--good),#8ee59f);transition:.25s}
.score{font-weight:900;color:var(--gold);white-space:nowrap}
.task{padding:22px;min-height:560px;display:flex;flex-direction:column}
.eyebrow{color:var(--accent);font-weight:850;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.prompt{font-size:clamp(25px,5.5vw,42px);font-weight:900;letter-spacing:-.04em;line-height:1.08;margin:7px 0 8px}
.sub{color:var(--muted);font-size:15px;line-height:1.4}
.stage{flex:1;display:grid;place-items:center;padding:16px 0;min-height:300px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{min-height:72px;border:none;border-radius:18px;background:rgba(255,255,255,.07);color:white;font-weight:850;font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:12px}
.answer:active{transform:scale(.985)}
.feedback{min-height:56px;margin-top:12px;border-radius:16px;padding:12px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px}
.feedback.good{background:rgba(73,209,125,.15);color:#8af0ad}
.feedback.bad{background:rgba(255,107,107,.15);color:#ff9b9b}
.next{border:none;border-radius:13px;padding:10px 14px;background:white;color:#111827;font-weight:900}
.fraction{display:inline-grid;vertical-align:middle;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.fraction .n{border-bottom:3px solid currentColor;padding:0 5px 4px}.fraction .d{padding-top:4px}
.visualGrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.pizza{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;position:relative;filter:drop-shadow(0 16px 20px rgba(0,0,0,.22));}
.pizza .slice{position:absolute;left:50%;top:50%;width:50%;height:50%;transform-origin:0 0;clip-path:polygon(0 0,100% 0,0 100%);cursor:pointer}
.pizza .slice:before{content:"";position:absolute;inset:4px;background:
radial-gradient(circle at 45% 28%,#d64d43 0 7%,transparent 8%),
radial-gradient(circle at 29% 52%,#d64d43 0 7%,transparent 8%),
linear-gradient(135deg,#f5ce55 0 66%,#c98732 67% 83%,#9b6128 84%);
clip-path:inherit;box-shadow:inset -7px -10px 12px rgba(112,63,23,.25)}
.pizza .slice.selected:before{filter:brightness(1.18) saturate(1.15);outline:4px solid #5ee79a}
.pizza .slice.selected{filter:drop-shadow(0 0 8px rgba(73,209,125,.9))}
.pizzaCenter{position:absolute;inset:48%;border-radius:50%;background:#efc34c;z-index:4}
.blockRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:650px}
.block{width:82px;height:82px;border:none;border-radius:18px;background:linear-gradient(145deg,#5ea7ff,#466fda);box-shadow:inset 8px 8px 12px rgba(255,255,255,.18),inset -9px -9px 15px rgba(0,0,0,.18),0 10px 15px rgba(0,0,0,.18);position:relative}
.block:after{content:"";position:absolute;inset:10px;border-radius:12px;border:2px solid rgba(255,255,255,.22)}
.block.selected{background:linear-gradient(145deg,#66e28f,#2cad66);transform:translateY(-5px);box-shadow:inset 8px 8px 12px rgba(255,255,255,.18),inset -9px -9px 15px rgba(0,0,0,.15),0 12px 20px rgba(62,209,118,.28)}
.confirm{margin-top:16px;min-width:180px}
.equation{display:flex;gap:12px;align-items:center;justify-content:center;font-size:clamp(34px,8vw,60px);font-weight:900;flex-wrap:wrap}
.choiceVisuals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:650px}
.visualChoice{border:none;border-radius:22px;background:rgba(255,255,255,.06);padding:15px;color:white;min-height:170px;display:grid;place-items:center}
.bar{display:flex;width:min(280px,75vw);height:90px;border-radius:16px;overflow:hidden;box-shadow:0 12px 20px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.16)}
.barPart{flex:1;background:linear-gradient(180deg,#384463,#2a344f);border-right:2px solid rgba(255,255,255,.2)}
.barPart.filled{background:linear-gradient(180deg,#ffd166,#e9a83c)}
.barPart:last-child{border-right:none}
.result{padding:26px;text-align:center}
.result h2{font-size:42px;margin:0 0 8px}.result p{color:var(--muted)}
.bigScore{font-size:70px;font-weight:950;color:var(--gold);letter-spacing:-.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:rgba(255,255,255,.06);padding:16px 8px;border-radius:17px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}
@media(max-width:700px){
  .hero{grid-template-columns:1fr}.heroArt{min-height:180px}.miniPizza{width:180px}
  .task{min-height:calc(100vh - 120px);padding:18px}
  .answers,.choiceVisuals{grid-template-columns:1fr}
  .modeGrid{grid-template-columns:1fr 1fr}
  .block{width:68px;height:68px}
}
@media(max-width:430px){
  .app{padding:10px}.start{padding:16px}.modeGrid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}.task{border-radius:20px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">BruchFit</div>
    <div class="badge">Version 1.0</div>
  </div>

  <section id="startScreen" class="card start">
    <div class="hero">
      <div>
        <h1>Brüche<br>begreifen.</h1>
        <p>Bruchrechnung zum Anfassen: Pizza teilen, Blöcke auswählen, Brüche erkennen und Addition oder Subtraktion üben.</p>
        <div class="sectionTitle">Übungsmodus</div>
        <div class="modeGrid" id="modeGrid">
          <button class="mode active" data-mode="mix"><b>🎯 Gemischt</b><small>Alle Aufgabentypen durcheinander</small></button>
          <button class="mode" data-mode="recognize"><b>🍕 Brüche erkennen</b><small>Passende Pizza oder Blöcke auswählen</small></button>
          <button class="mode" data-mode="build"><b>🧱 Brüche bauen</b><small>Die richtige Anzahl Teile markieren</small></button>
          <button class="mode" data-mode="calc"><b>➕➖ Rechnen</b><small>Addition und Subtraktion mit gleichen Nennern</small></button>
        </div>
        <button id="startBtn" class="primary startBtn">Training starten</button>
      </div>
      <div class="heroArt"><div class="miniPizza"></div></div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="status">
      <button id="backBtn" class="back">←</button>
      <div class="progressWrap"><div id="progress" class="progress"></div></div>
      <div id="score" class="score">⭐ 0</div>
    </div>
    <div class="card task">
      <div id="eyebrow" class="eyebrow">Bruch erkennen</div>
      <div id="prompt" class="prompt"></div>
      <div id="sub" class="sub"></div>
      <div id="stage" class="stage"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden"></div>
    </div>
  </section>

  <section id="resultScreen" class="card result hidden">
    <div style="font-size:54px">🏆</div>
    <h2>Training geschafft!</h2>
    <p>Dein Ergebnis</p>
    <div id="bigScore" class="bigScore">0</div>
    <div class="stats">
      <div class="stat"><b id="correctStat">0</b><span>richtig</span></div>
      <div class="stat"><b id="wrongStat">0</b><span>Fehler</span></div>
      <div class="stat"><b id="percentStat">0%</b><span>Trefferquote</span></div>
    </div>
    <button id="againBtn" class="primary" style="width:100%">Noch einmal</button>
  </section>
</div>

<script>
(() => {
'use strict';
const VERSION='1.0';
const TOTAL=12;
let mode='mix', idx=0, score=0, correct=0, wrong=0, locked=false, current=null, selected=new Set();

const $=id=>document.getElementById(id);
const startScreen=$('startScreen'), gameScreen=$('gameScreen'), resultScreen=$('resultScreen');
const promptEl=$('prompt'), subEl=$('sub'), stage=$('stage'), answers=$('answers'), feedback=$('feedback');
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const frac=(n,d)=>`<span class="fraction"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const simplify=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]};

document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); mode=b.dataset.mode;
}));
$('startBtn').onclick=startGame;
$('againBtn').onclick=()=>{resultScreen.classList.add('hidden');startScreen.classList.remove('hidden')};
$('backBtn').onclick=()=>{gameScreen.classList.add('hidden');startScreen.classList.remove('hidden')};

function startGame(){
 idx=0;score=0;correct=0;wrong=0;
 startScreen.classList.add('hidden'); resultScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
 nextTask();
}
function setProgress(){
 $('progress').style.width=`${idx/TOTAL*100}%`;
 $('score').textContent=`⭐ ${score}`;
}
function clearTask(){
 locked=false; selected.clear(); stage.innerHTML='';answers.innerHTML='';feedback.className='feedback hidden';feedback.innerHTML='';
}
function nextTask(){
 if(idx>=TOTAL){finish();return}
 clearTask();setProgress();
 const kind= mode==='mix'?pick(['recognize','recognize','build','build','calc']):mode;
 if(kind==='recognize') taskRecognize();
 if(kind==='build') taskBuild();
 if(kind==='calc') taskCalc();
}
function finish(){
 gameScreen.classList.add('hidden');resultScreen.classList.remove('hidden');
 $('bigScore').textContent=score;
 $('correctStat').textContent=correct;$('wrongStat').textContent=wrong;
 $('percentStat').textContent=Math.round(correct/TOTAL*100)+'%';
}
function done(ok,msg){
 if(locked)return; locked=true;
 if(ok){score+=10;correct++}else{wrong++}
 $('score').textContent=`⭐ ${score}`;
 feedback.className='feedback '+(ok?'good':'bad');
 feedback.innerHTML=`<span>${ok?'✓ Richtig!':'✗ Noch nicht.'} ${msg||''}</span><button class="next">Weiter</button>`;
 feedback.querySelector('.next').onclick=()=>{idx++;nextTask()};
}
function taskRecognize(){
 const den=pick([2,3,4,5,6,8]), num=rand(1,den-1);
 current={num,den};
 $('eyebrow').textContent='Bruch erkennen';
 promptEl.innerHTML=`Welche Darstellung zeigt ${frac(num,den)}?`;
 subEl.textContent='Tippe auf die passende Darstellung.';
 const options=[{n:num,d:den}];
 while(options.length<4){
   const d=pick([2,3,4,5,6,8]); const n=rand(1,d-1);
   if(!options.some(o=>o.n===n&&o.d===d) && n/d!==num/den) options.push({n,d});
 }
 options.sort(()=>Math.random()-.5);
 const wrap=document.createElement('div');wrap.className='choiceVisuals';
 options.forEach(o=>{
   const b=document.createElement('button');b.className='visualChoice';
   b.innerHTML=barHTML(o.n,o.d);
   b.onclick=()=>done(o.n===num&&o.d===den,`Gesucht war ${num}/${den}.`);
   wrap.appendChild(b);
 });
 stage.appendChild(wrap);
}
function taskBuild(){
 const den=pick([2,3,4,5,6,8]), num=rand(1,den-1), type=pick(['blocks','pizza']);
 current={num,den,type};
 $('eyebrow').textContent='Bruch bauen';
 promptEl.innerHTML=`Stelle ${frac(num,den)} dar.`;
 subEl.textContent=type==='pizza'?`Tippe genau ${num} von ${den} Pizzastücken an.`:`Tippe genau ${num} von ${den} Blöcken an.`;
 if(type==='blocks') buildBlocks(den);
 else buildPizza(den);
 const c=document.createElement('button');c.className='primary confirm';c.textContent='Prüfen';
 c.onclick=()=>done(selected.size===num,`Du brauchst ${num} von ${den} Teilen.`);
 stage.appendChild(c);
}
function buildBlocks(den){
 const row=document.createElement('div');row.className='blockRow';
 for(let i=0;i<den;i++){
   const b=document.createElement('button');b.className='block';b.setAttribute('aria-label','Block');
   b.onclick=()=>{
     if(locked)return;
     selected.has(i)?selected.delete(i):selected.add(i);
     b.classList.toggle('selected',selected.has(i));
   };row.appendChild(b)
 }
 stage.appendChild(row);
}
function buildPizza(den){
 const p=document.createElement('div');p.className='pizza';
 const angle=360/den;
 for(let i=0;i<den;i++){
   const s=document.createElement('div');s.className='slice';
   // use a triangular wedge from center; visual works best up to 8 pieces
   s.style.transform=`rotate(${i*angle}deg) skewY(${90-angle}deg)`;
   s.dataset.i=i;
   s.onclick=()=>{
     if(locked)return;
     selected.has(i)?selected.delete(i):selected.add(i);
     s.classList.toggle('selected',selected.has(i));
   };
   p.appendChild(s);
 }
 const c=document.createElement('div');c.className='pizzaCenter';p.appendChild(c);
 stage.appendChild(p);
}
function taskCalc(){
 const den=pick([3,4,5,6,8]);
 const op=pick(['+','-']);
 let a,b,res;
 if(op==='+'){
   a=rand(1,den-2); b=rand(1,den-a-1); res=a+b;
 } else {
   a=rand(2,den-1); b=rand(1,a-1); res=a-b;
 }
 current={den,a,b,res,op};
 $('eyebrow').textContent='Brüche rechnen';
 promptEl.textContent='Wie viel ist das?';
 subEl.textContent='Bei gleichem Nenner werden die Zähler addiert oder subtrahiert.';
 const eq=document.createElement('div');eq.className='equation';
 eq.innerHTML=`${frac(a,den)} <span>${op}</span> ${frac(b,den)} <span>=</span> <span>?</span>`;
 stage.appendChild(eq);
 const [sn,sd]=simplify(res,den);
 const opts=[{n:sn,d:sd,ok:true}];
 while(opts.length<4){
   let n=rand(1,den),d=pick([den,den,2,3,4,5,6,8]);
   let [nn,dd]=simplify(n,d);
   if(!opts.some(o=>o.n===nn&&o.d===dd) && nn/dd!==sn/sd)opts.push({n:nn,d:dd,ok:false});
 }
 opts.sort(()=>Math.random()-.5).forEach(o=>{
   const b=document.createElement('button');b.className='answer';b.innerHTML=frac(o.n,o.d);
   b.onclick=()=>done(o.ok,`Ergebnis: ${sn}/${sd}.`);
   answers.appendChild(b);
 });
}
function barHTML(n,d){
 let parts='';
 for(let i=0;i<d;i++)parts+=`<div class="barPart ${i<n?'filled':''}"></div>`;
 return `<div class="bar">${parts}</div>`;
}
})();
</script>
</body>
</html>
