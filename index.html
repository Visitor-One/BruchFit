<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b111d">
<title>BruchFit – Bruchrechnung lernen</title>
<style>
:root{
  --bg:#0b111d;--panel:#121c2b;--panel2:#182537;--text:#f7fbff;--muted:#9fb0c3;
  --good:#58d68d;--bad:#ff6b6b;--accent:#42bff5;--accent2:#7c70ff;--gold:#ffd45c;
  --line:#33465a;--shadow:0 18px 44px rgba(0,0,0,.3)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 15% 8%,rgba(66,191,245,.14),transparent 30%),
radial-gradient(circle at 85% 15%,rgba(124,112,255,.12),transparent 28%),
linear-gradient(180deg,#08101a,#0e1724 58%,#09111b);
color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
.app{width:min(980px,100%);margin:auto;padding:14px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-weight:950;font-size:clamp(23px,4vw,32px);letter-spacing:-.045em}
.badge{margin-left:auto;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);font-size:12px}
.card{background:linear-gradient(180deg,rgba(24,37,55,.97),rgba(14,24,38,.97));border:1px solid rgba(255,255,255,.07);box-shadow:var(--shadow);border-radius:24px}
.start{padding:20px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:.95;margin:0 0 12px;letter-spacing:-.06em}
.hero p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 20px}
.heroArt{min-height:240px;display:grid;place-items:center}
.demoRing{width:min(255px,66vw);aspect-ratio:1;border-radius:50%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;transform:rotate(45deg);filter:drop-shadow(0 18px 20px rgba(0,0,0,.24))}
.demoRing div{background:linear-gradient(145deg,#41c4ff,#2993df);box-shadow:inset 8px 8px 12px rgba(255,255,255,.14),inset -8px -8px 15px rgba(0,0,0,.18)}
.demoRing div:nth-child(1){border-radius:100% 10px 10px 10px}
.demoRing div:nth-child(2){border-radius:10px 100% 10px 10px}
.demoRing div:nth-child(3){border-radius:10px 10px 10px 100%;background:#354452}
.demoRing div:nth-child(4){border-radius:10px 10px 100% 10px}
.sectionTitle{font-weight:850;margin:17px 0 10px}
.modeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border:none;color:white;background:rgba(255,255,255,.055);padding:14px;border-radius:18px;text-align:left;min-height:84px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}
.mode.active{background:linear-gradient(135deg,rgba(66,191,245,.25),rgba(124,112,255,.21));box-shadow:inset 0 0 0 2px rgba(66,191,245,.8)}
.mode.learnMode{background:linear-gradient(135deg,rgba(88,214,141,.15),rgba(66,191,245,.12))}
.mode.learnMode.active{box-shadow:inset 0 0 0 2px rgba(88,214,141,.85)}
.mode b{display:block;margin-bottom:5px}.mode small{color:var(--muted);line-height:1.35}
.primary,.secondary{border:none;border-radius:18px;padding:16px 20px;font-weight:900}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 25px rgba(66,191,245,.2)}
.secondary{background:rgba(255,255,255,.075);color:white}
.startBtn{width:100%;margin-top:18px;font-size:18px}
.hidden{display:none!important}
.status{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.back{width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.07);color:white;font-size:20px}
.progressWrap{height:12px;background:rgba(255,255,255,.075);border-radius:999px;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,#7ee12b,#56cb43);transition:.25s}
.score{font-weight:900;color:var(--gold);white-space:nowrap}
.task{padding:22px;min-height:575px;display:flex;flex-direction:column}
.eyebrow{color:var(--accent);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.prompt{font-size:clamp(25px,5.4vw,42px);font-weight:950;letter-spacing:-.04em;line-height:1.08;margin:7px 0 8px}
.sub{color:var(--muted);font-size:15px;line-height:1.45}
.stage{flex:1;display:grid;place-items:center;padding:17px 0;min-height:300px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{min-height:72px;border:none;border-radius:18px;background:rgba(255,255,255,.065);color:white;font-weight:900;font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:12px}
.answer:active,.visualChoice:active{transform:scale(.985)}
.answer.wrongChoice,.visualChoice.wrongChoice{
  background:rgba(255,107,107,.13);
  box-shadow:inset 0 0 0 2px rgba(255,107,107,.55);
  color:#ffaaaa;
  opacity:.72;
}
.answer.wrongChoice:disabled,.visualChoice.wrongChoice:disabled{cursor:default}
.feedback{min-height:56px;margin-top:12px;border-radius:16px;padding:12px 14px;font-weight:850;display:flex;align-items:center;justify-content:space-between;gap:10px}
.feedback.good{background:rgba(88,214,141,.15);color:#91efb6}.feedback.bad{background:rgba(255,107,107,.15);color:#ff9d9d}
.next{border:none;border-radius:13px;padding:10px 14px;background:white;color:#111827;font-weight:900}
.fraction{display:inline-grid;vertical-align:middle;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.fraction .n{border-bottom:3px solid currentColor;padding:0 5px 4px}.fraction .d{padding-top:4px}
.blockRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:650px}
.block{width:78px;height:78px;border:none;border-radius:17px;background:linear-gradient(145deg,#41556c,#2c3a4c);box-shadow:inset 8px 8px 12px rgba(255,255,255,.08),inset -9px -9px 15px rgba(0,0,0,.2),0 9px 14px rgba(0,0,0,.16);position:relative}
.block:after{content:"";position:absolute;inset:9px;border-radius:11px;border:2px solid rgba(255,255,255,.13)}
.block.selected{background:linear-gradient(145deg,#46d8ff,#078fe0);transform:translateY(-5px);box-shadow:inset 8px 8px 12px rgba(255,255,255,.22),inset -9px -9px 15px rgba(0,0,0,.12),0 0 0 4px rgba(79,222,255,.18),0 12px 20px rgba(24,173,231,.35)}

.confirm{margin-top:16px;min-width:180px}
.denBuilder{width:100%;max-width:720px;display:grid;gap:22px;justify-items:center}
.denTitle{font-size:16px;color:var(--muted);font-weight:800;text-align:center}
.sliderArea{width:min(560px,90%);display:grid;gap:10px}
.denSlider{width:100%;height:44px;appearance:none;-webkit-appearance:none;background:transparent;touch-action:pan-y}
.denSlider::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(90deg,#304257,#243246);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.denSlider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;margin-top:-12px;background:linear-gradient(145deg,#f7fbff,#b9c7d5);border:4px solid #213247;box-shadow:0 5px 12px rgba(0,0,0,.32)}
.denSlider::-moz-range-track{height:10px;border-radius:999px;background:#2b3a4e}
.denSlider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#edf5fb;border:4px solid #213247}
.sliderScale{display:flex;justify-content:space-between;color:#718398;font-size:12px;padding:0 4px}
.previewBlocks{min-height:90px;display:flex;flex-wrap:wrap;gap:11px;justify-content:center;align-items:center;width:100%}
.previewBlock{width:66px;height:66px;border-radius:15px;background:linear-gradient(145deg,#41556c,#2c3a4c);box-shadow:inset 7px 7px 10px rgba(255,255,255,.07),inset -8px -8px 13px rgba(0,0,0,.19),0 8px 13px rgba(0,0,0,.15);position:relative}
.previewBlock:after{content:"";position:absolute;inset:8px;border-radius:10px;border:2px solid rgba(255,255,255,.11)}
.blockTaskWrap{display:grid;gap:18px;justify-items:center;width:100%}
.blockCounter{font-size:15px;color:var(--muted);font-weight:800;text-align:center}
.blockCounter strong{color:var(--accent);font-size:20px}

.equation{display:flex;gap:12px;align-items:center;justify-content:center;font-size:clamp(34px,8vw,60px);font-weight:950;flex-wrap:wrap}
.choiceVisuals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:660px}
.visualChoice{border:none;border-radius:22px;background:rgba(255,255,255,.055);padding:16px;color:white;min-height:170px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.bar{display:flex;width:min(290px,76vw);height:92px;border-radius:17px;overflow:hidden;box-shadow:0 12px 20px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.14)}
.barPart{flex:1;background:linear-gradient(180deg,#344354,#253240);border-right:2px solid rgba(255,255,255,.15)}
.barPart.filled{background:linear-gradient(180deg,#43c9ff,#169ce5)}
.barPart:last-child{border-right:none}
.pieGroup{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.pie{width:min(230px,64vw);aspect-ratio:1;border-radius:50%;position:relative;filter:drop-shadow(0 14px 18px rgba(0,0,0,.24))}
.pie .slice{position:absolute;left:50%;top:50%;width:48%;height:48%;transform-origin:0 0;clip-path:polygon(0 0,100% 0,0 100%);cursor:pointer}
.pie .slice:before{content:"";position:absolute;inset:4px;background:
radial-gradient(circle at 46% 28%,#bd392f 0 7%,transparent 8%),
radial-gradient(circle at 30% 52%,#bd392f 0 7%,transparent 8%),
linear-gradient(135deg,#ffbd48 0 64%,#d7832c 65% 82%,#9a5a24 83%);
clip-path:inherit;box-shadow:inset -7px -10px 12px rgba(100,55,20,.26)}
/* maximaler Farbkontrast: ausgewählt = kräftig blau statt gelb/orange */
.pie .slice.selected:before{
  background:linear-gradient(135deg,#4cd7ff 0 65%,#138fda 66% 83%,#0a5f9e 84%);
  box-shadow:inset 7px 8px 11px rgba(255,255,255,.24),inset -7px -10px 12px rgba(0,55,95,.25)
}
.pie .slice.selected{filter:drop-shadow(0 0 8px rgba(76,215,255,.95))}
.pieCenter{position:absolute;inset:47.5%;border-radius:50%;background:#0d1724;z-index:4}
.multiVisual{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}
.improperWrap{display:grid;gap:14px;justify-items:center}
.improperRow{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap}
.improperUnit{display:grid;justify-items:center}
.improperPlus{font-size:38px;font-weight:950;color:var(--muted)}
.smallPie{width:120px;height:120px;border-radius:50%;position:relative;overflow:hidden;background:conic-gradient(#43c9ff 0deg var(--fill),#344354 var(--fill) 360deg);box-shadow:inset 0 0 0 5px rgba(255,255,255,.08),0 10px 18px rgba(0,0,0,.18)}
.smallPie:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(transparent 0deg calc(var(--step) - 2deg),rgba(11,17,29,.94) calc(var(--step) - 2deg) var(--step))}
.smallPie:before{content:"";position:absolute;inset:43%;background:#0e1825;border-radius:50%;z-index:2}
.learnCards{display:grid;gap:12px;width:100%;max-width:720px}
.learnCard{padding:18px;border-radius:20px;background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.learnCard h3{margin:0 0 8px;font-size:21px}.learnCard p{margin:0;color:var(--muted);line-height:1.5}
.learnExample{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:28px;font-weight:900;flex-wrap:wrap}
.learnNav{display:flex;gap:10px;margin-top:14px}.learnNav button{flex:1}

.denLearn{width:100%;display:grid;gap:20px}
.denIntro{max-width:760px;color:var(--muted);line-height:1.5}
.fractionEditors{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;width:100%}
.frEditor{display:grid;gap:12px;justify-items:center;padding:16px;border-radius:20px;background:rgba(255,255,255,.045);min-width:0}
.frEditorTitle{font-size:13px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.06em}
.frPizza{width:min(230px,34vw);aspect-ratio:1}
.frPizza svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.2))}
.frPizza path{stroke:#0d1724;stroke-width:2.5;cursor:pointer;transition:.15s}
.frPizza path.off{fill:#344354}
.frPizza path.on{fill:#43c9ff}
.frPizza path:hover{filter:brightness(1.08)}
.frLive{font-size:30px;font-weight:950}
.frSliderWrap{width:min(270px,100%);display:grid;gap:5px}
.frSlider{width:100%;height:38px;appearance:none;-webkit-appearance:none;background:transparent}
.frSlider::-webkit-slider-runnable-track{height:9px;border-radius:999px;background:#2b3a4e}
.frSlider::-webkit-slider-thumb{-webkit-appearance:none;width:29px;height:29px;border-radius:50%;margin-top:-10px;background:#f2f7fb;border:4px solid #213247;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.frSliderScale{display:flex;justify-content:space-between;font-size:11px;color:#718398}
.bigPlus{font-size:42px;font-weight:950;color:var(--muted)}
.liveEquation{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:34px;font-weight:950;padding:10px}
.denActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.commonPanel{display:grid;gap:14px;padding:18px;border-radius:20px;background:rgba(66,191,245,.07);box-shadow:inset 0 0 0 1px rgba(66,191,245,.15)}
.commonTitle{font-size:20px;font-weight:950;text-align:center}
.commonText{color:var(--muted);line-height:1.5;text-align:center}
.converted{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;justify-items:center}
.convertBox{display:grid;gap:8px;justify-items:center}
.convertPizza{width:150px;aspect-ratio:1}
.convertPizza svg{width:100%;height:100%;display:block}
.convertPizza path{stroke:#0d1724;stroke-width:2;fill:#344354}
.convertPizza path.on{fill:#43c9ff}
.convertFrac{font-size:27px;font-weight:950}
.arrowEq{font-size:28px;color:var(--muted);font-weight:900}
.parentTip{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.045);color:var(--muted);line-height:1.5}
.parentTip b{color:var(--text)}
@media(max-width:700px){
 .fractionEditors{grid-template-columns:1fr}
 .bigPlus{font-size:32px}
 .frPizza{width:min(230px,65vw)}
 .converted{grid-template-columns:1fr;gap:8px}
 .arrowEq{transform:rotate(90deg)}
}
.result{padding:26px;text-align:center}.result h2{font-size:42px;margin:0 0 8px}.result p{color:var(--muted)}
.bigScore{font-size:70px;font-weight:950;color:var(--gold);letter-spacing:-.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:rgba(255,255,255,.055);padding:16px 8px;border-radius:17px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}
@media(max-width:700px){
 .hero{grid-template-columns:1fr}.heroArt{min-height:180px}.demoRing{width:180px}
 .task{min-height:calc(100vh - 118px);padding:18px}.answers,.choiceVisuals{grid-template-columns:1fr}
 .modeGrid{grid-template-columns:1fr 1fr}.block{width:66px;height:66px}
}
@media(max-width:430px){.app{padding:10px}.start{padding:16px}.modeGrid{grid-template-columns:1fr}.task{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar"><div class="brand">BruchFit</div><div class="badge">Version 8.0</div></div>

 <section id="startScreen" class="card start">
  <div class="hero">
   <div>
    <h1>Brüche<br>begreifen.</h1>
    <p>Vom Aufteilen bis zum Rechnen: erst verstehen, dann üben – mit Pizza, Blöcken und visuellen Aufgaben.</p>
    <div class="sectionTitle">Bereich auswählen</div>
    <div class="modeGrid">
      <button class="mode learnMode" data-mode="learn"><b>📘 Lernbereich</b><small>Zähler, Nenner, gleichnamig machen und Rechenwege verstehen</small></button>
      <button class="mode learnMode" data-mode="denlearn"><b>🍕 Gemeinsamer Nenner</b><small>Interaktiver Eltern-Lernbereich mit zwei Pizzen und direkter Umteilung</small></button>
      <button class="mode active" data-mode="mix"><b>🎯 Gemischtes Training</b><small>Erkennen, darstellen und rechnen durcheinander</small></button>
      <button class="mode" data-mode="recognize"><b>🔎 Brüche erkennen</b><small>Auch schwierigere Darstellungen und unechte Brüche</small></button>
      <button class="mode" data-mode="build"><b>🧱 Brüche bauen</b><small>Pizza- oder Blockteile gezielt auswählen</small></button>
      <button class="mode" data-mode="calc"><b>➕➖ Rechnen</b><small>Gleiche und verschiedene Nenner</small></button>
    </div>
    <button id="startBtn" class="primary startBtn">Starten</button>
   </div>
   <div class="heroArt"><div class="demoRing"><div></div><div></div><div></div><div></div></div></div>
  </div>
 </section>

 <section id="gameScreen" class="hidden">
  <div class="status">
   <button id="backBtn" class="back">←</button>
   <div class="progressWrap"><div id="progress" class="progress"></div></div>
   <div id="score" class="score">⭐ 0</div>
  </div>
  <div class="card task">
   <div id="eyebrow" class="eyebrow"></div>
   <div id="prompt" class="prompt"></div>
   <div id="sub" class="sub"></div>
   <div id="stage" class="stage"></div>
   <div id="answers" class="answers"></div>
   <div id="feedback" class="feedback hidden"></div>
  </div>
 </section>

 <section id="resultScreen" class="card result hidden">
  <div style="font-size:54px">🏆</div><h2>Training geschafft!</h2><p>Dein Ergebnis</p>
  <div id="bigScore" class="bigScore">0</div>
  <div class="stats">
   <div class="stat"><b id="correctStat">0</b><span>richtig</span></div>
   <div class="stat"><b id="wrongStat">0</b><span>Fehler</span></div>
   <div class="stat"><b id="percentStat">0%</b><span>Trefferquote</span></div>
  </div>
  <button id="againBtn" class="primary" style="width:100%">Zurück zum Start</button>
 </section>
</div>

<script>
(()=>{'use strict';
const TOTAL=14;
let mode='mix',idx=0,score=0,correct=0,wrong=0,locked=false,selected=new Set(),lesson=0;
const $=id=>document.getElementById(id),start=$('startScreen'),game=$('gameScreen'),result=$('resultScreen');
const promptEl=$('prompt'),subEl=$('sub'),stage=$('stage'),answers=$('answers'),feedback=$('feedback');
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[Math.floor(Math.random()*a.length)];
const frac=(n,d)=>`<span class="fraction"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const simp=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);

document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;
});
$('startBtn').onclick=()=>{start.classList.add('hidden');game.classList.remove('hidden');result.classList.add('hidden');idx=score=correct=wrong=0;lesson=0; if(mode==='learn')showLesson(); else if(mode==='denlearn')showDenominatorLab(); else nextTask()};
$('backBtn').onclick=()=>{game.classList.add('hidden');start.classList.remove('hidden')};
$('againBtn').onclick=()=>{result.classList.add('hidden');start.classList.remove('hidden')};

function clearTask(){locked=false;selected.clear();stage.innerHTML='';answers.innerHTML='';feedback.className='feedback hidden';feedback.innerHTML=''}
function setProgress(){
 if(mode==='learn'){
   $('progress').style.width=((lesson+1)/4*100)+'%';
   $('score').textContent='📘 Lernen';
 }else if(mode==='denlearn'){
   $('progress').style.width='100%';
   $('score').textContent='🍕 Erklären';
 }else{
   $('progress').style.width=(idx/TOTAL*100)+'%';
   $('score').textContent=`⭐ ${score}`;
 }
}
function nextTask(){
 if(idx>=TOTAL){finish();return}
 clearTask();setProgress();
 const kind=mode==='mix'?pick(['recognize','recognize','build','calc','calc']):mode;
 if(kind==='recognize') taskRecognize();
 else if(kind==='build') taskBuild();
 else taskCalc();
}
function finish(){
 game.classList.add('hidden');result.classList.remove('hidden');
 $('bigScore').textContent=score;$('correctStat').textContent=correct;$('wrongStat').textContent=wrong;
 $('percentStat').textContent=Math.round(correct/TOTAL*100)+'%';
}
function done(ok,msg,source){
 if(locked)return;

 if(!ok){
   wrong++;
   $('score').textContent=`⭐ ${score}`;
   if(source){
     source.classList.add('wrongChoice');
     source.disabled=true;
   }
   feedback.className='feedback bad';
   feedback.innerHTML='<span>✗ Nicht ganz. Versuch es noch einmal.</span>';
   return;
 }

 locked=true;
 score+=10;
 correct++;
 $('score').textContent=`⭐ ${score}`;
 feedback.className='feedback good';
 feedback.innerHTML=`<span>✓ Richtig! ${msg||''}</span><button class="next">Weiter</button>`;
 feedback.querySelector('.next').onclick=()=>{idx++;nextTask()}
}
function taskRecognize(){
 const variant=pick(['visualToFraction','fractionToVisual','improper']);
 $('eyebrow').textContent='Brüche erkennen';
 if(variant==='visualToFraction') return recognizeVisualToFraction();
 if(variant==='fractionToVisual') return recognizeFractionToVisual();
 return recognizeImproper();
}
function recognizeVisualToFraction(){
 const d=pick([3,4,5,6,8]),n=rand(1,d-1);
 promptEl.textContent='Welcher Bruch ist dargestellt?';subEl.textContent='Achte genau auf die Anzahl aller Teile und der markierten Teile.';
 stage.innerHTML=barHTML(n,d);
 const correctS=simp(n,d),opts=[{n:correctS[0],d:correctS[1],ok:true}];
 while(opts.length<4){
  const dd=pick([2,3,4,5,6,8]),nn=rand(1,dd);
  const s=simp(nn,dd);
  if(!opts.some(o=>o.n===s[0]&&o.d===s[1]) && s[0]/s[1]!==correctS[0]/correctS[1]) opts.push({n:s[0],d:s[1],ok:false});
 }
 opts.sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.className='answer';b.innerHTML=frac(o.n,o.d);b.onclick=()=>done(o.ok,`Dargestellt waren ${n} von ${d} Teilen.`,b);answers.appendChild(b)})
}
function recognizeFractionToVisual(){
 const d=pick([3,4,5,6,8]),n=rand(1,d-1);
 promptEl.innerHTML=`Welche Darstellung zeigt ${frac(n,d)}?`;subEl.textContent='Mehrere Antworten sehen ähnlich aus – zähle die Teilstücke.';
 const opts=[{n,d,ok:true}];
 while(opts.length<4){
   const dd=pick([3,4,5,6,8]),nn=rand(1,dd-1);
   if(!opts.some(o=>o.n===nn&&o.d===dd) && nn/dd!==n/d) opts.push({n:nn,d:dd,ok:false});
 }
 const wrap=document.createElement('div');wrap.className='choiceVisuals';
 opts.sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.className='visualChoice';b.innerHTML=barHTML(o.n,o.d);b.onclick=()=>done(o.ok,`Gesucht war ${n}/${d}.`,b);wrap.appendChild(b)});
 stage.appendChild(wrap)
}
function recognizeImproper(){
 let d1,d2,n1,n2,sumN,sumD,s;

 // Zwei visuelle Brüche erzeugen; unterschiedliche Nenner werden ausdrücklich zugelassen.
 // Die Summe soll größer als 1 sein, damit ein unechter Bruch entsteht.
 do{
   d1=pick([2,3,4,5,6,8]);
   d2=pick([2,3,4,5,6,8]);
   n1=rand(1,d1);
   n2=rand(1,d2);
   sumD=lcm(d1,d2);
   sumN=n1*(sumD/d1)+n2*(sumD/d2);
 }while(sumN<=sumD || (d1===d2 && Math.random()<0.7));

 s=simp(sumN,sumD);

 promptEl.textContent='Welcher Bruch ist dargestellt?';
 subEl.textContent='';

 const wrap=document.createElement('div');
 wrap.className='improperWrap';

 const row=document.createElement('div');
 row.className='improperRow';

 const left=document.createElement('div');
 left.className='improperUnit';
 left.innerHTML=smallPieHTML(n1,d1);

 const plus=document.createElement('div');
 plus.className='improperPlus';
 plus.textContent='+';

 const right=document.createElement('div');
 right.className='improperUnit';
 right.innerHTML=smallPieHTML(n2,d2);

 row.append(left,plus,right);
 wrap.append(row);
 stage.appendChild(wrap);

 const opts=[{n:s[0],d:s[1],ok:true}];

 const candidates=[
   simp(n1+n2,Math.max(d1,d2)),
   simp(n1+n2,d1+d2),
   simp(Math.max(1,sumN-1),sumD),
   simp(sumN+1,sumD),
   simp(n1,d1),
   simp(n2,d2)
 ];

 for(const z of candidates){
   if(opts.length>=4)break;
   if(z[1]!==0 && !opts.some(o=>o.n===z[0]&&o.d===z[1]) && z[0]/z[1]!==s[0]/s[1]){
     opts.push({n:z[0],d:z[1],ok:false});
   }
 }

 while(opts.length<4){
   const dd=pick([2,3,4,5,6,8,10,12,15,20,24]);
   const nn=rand(1,Math.max(2,dd*2));
   const z=simp(nn,dd);
   if(!opts.some(o=>o.n===z[0]&&o.d===z[1]) && z[0]/z[1]!==s[0]/s[1]){
     opts.push({n:z[0],d:z[1],ok:false});
   }
 }

 opts.sort(()=>Math.random()-.5).forEach(o=>{
   const b=document.createElement('button');
   b.className='answer';
   b.innerHTML=frac(o.n,o.d);
   b.onclick=()=>done(o.ok,'',b);
   answers.appendChild(b);
 });
}
function taskBuild(){
 const d=pick([3,4,5,6,8]),n=rand(1,d-1),type=pick(['blocks','pizza']);
 $('eyebrow').textContent='Bruch darstellen';promptEl.innerHTML=`Stelle ${frac(n,d)} dar.`;

function buildBlocksInteractive(n,d){
 let chosenDen=2;

 const wrap=document.createElement('div');
 wrap.className='denBuilder';

 const title=document.createElement('div');
 title.className='denTitle';
 title.textContent='Lege die Anzahl der Blöcke fest.';

 const sliderArea=document.createElement('div');
 sliderArea.className='sliderArea';

 const slider=document.createElement('input');
 slider.type='range';
 slider.min='2';
 slider.max='10';
 slider.step='1';
 slider.value=String(chosenDen);
 slider.className='denSlider';
 slider.setAttribute('aria-label','Anzahl der Blöcke');

 const scale=document.createElement('div');
 scale.className='sliderScale';
 scale.innerHTML='<span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>';

 sliderArea.append(slider,scale);

 const preview=document.createElement('div');
 preview.className='previewBlocks';

 const create=document.createElement('button');
 create.className='primary confirm';
 create.textContent='Übernehmen';

 function renderPreview(){
   chosenDen=Number(slider.value);
   preview.innerHTML='';
   for(let i=0;i<chosenDen;i++){
     const b=document.createElement('div');
     b.className='previewBlock';
     preview.appendChild(b);
   }
 }

 slider.addEventListener('input',renderPreview);
 renderPreview();

 wrap.append(title,preview,sliderArea,create);
 stage.appendChild(wrap);

 create.onclick=()=>{
   if(locked)return;

   if(chosenDen!==d){
     feedback.className='feedback bad';
     feedback.innerHTML='<span>✗ Die Aufteilung passt noch nicht zum gesuchten Bruch.</span>';
     return;
   }

   feedback.className='feedback hidden';
   feedback.innerHTML='';

   const taskWrap=document.createElement('div');
   taskWrap.className='blockTaskWrap';

   const row=document.createElement('div');

     const b=document.createElement('button');

function buildPie(d){
 const p=document.createElement('div');p.className='pie';const angle=360/d;
 for(let i=0;i<d;i++){
  const s=document.createElement('div');s.className='slice';s.style.transform=`rotate(${i*angle}deg) skewY(${90-angle}deg)`;
  s.onclick=()=>{if(locked)return;selected.has(i)?selected.delete(i):selected.add(i);s.classList.toggle('selected',selected.has(i))};p.appendChild(s)
 }
 const c=document.createElement('div');c.className='pieCenter';p.appendChild(c);stage.appendChild(p)
}
function taskCalc(){
 $('eyebrow').textContent='Brüche rechnen';
 const different=Math.random()<.68;
 let a,b,c,d,op=pick(['+','-']),rn,rd;
 if(different){
   const pairs=pick([[2,4],[2,6],[3,6],[3,9],[4,8],[4,6],[5,10]]);
   b=pairs[0];d=pairs[1];a=rand(1,b-1);c=rand(1,d-1);
   let common=lcm(b,d),aa=a*(common/b),cc=c*(common/d);
   if(op==='-' && aa<=cc){[a,c]=[Math.max(1,b-1),1];aa=a*(common/b);cc=c*(common/d);if(aa<=cc){op='+'}}
   rn=op==='+'?aa+cc:aa-cc;rd=common;
 }else{
   b=d=pick([3,4,5,6,8]);a=rand(1,b-2);c=rand(1,b-1);
   if(op==='-'&&a<=c){a=rand(2,b-1);c=rand(1,a-1)}
   rn=op==='+'?a+c:a-c;rd=b;
 }
 const s=simp(rn,rd);
 promptEl.textContent='Wie viel ist das?';
 subEl.textContent=b===d?'Die Nenner sind schon gleich.':'Die Nenner sind verschieden. Finde zuerst einen gemeinsamen Nenner.';
 const eq=document.createElement('div');eq.className='equation';eq.innerHTML=`${frac(a,b)} <span>${op}</span> ${frac(c,d)} <span>=</span> ?`;stage.appendChild(eq);
 const opts=[{n:s[0],d:s[1],ok:true}];
 while(opts.length<4){
   const dd=pick([2,3,4,5,6,8,10,12]),nn=rand(1,Math.max(1,dd));
   const z=simp(nn,dd);
   if(!opts.some(o=>o.n===z[0]&&o.d===z[1]) && z[0]/z[1]!==s[0]/s[1])opts.push({n:z[0],d:z[1],ok:false})
 }
 opts.sort(()=>Math.random()-.5).forEach(o=>{const bt=document.createElement('button');bt.className='answer';bt.innerHTML=frac(o.n,o.d);bt.onclick=()=>done(o.ok,b===d?`Ergebnis: ${s[0]}/${s[1]}.`:`Gemeinsamer Nenner ${lcm(b,d)}. Ergebnis: ${s[0]}/${s[1]}.`,bt);answers.appendChild(bt)})
}
function barHTML(n,d){let p='';for(let i=0;i<d;i++)p+=`<div class="barPart ${i<n?'filled':''}"></div>`;return `<div class="bar">${p}</div>`}
function smallPieHTML(n,d){const step=360/d,fill=360*n/d;return `<div class="smallPie" style="--step:${step}deg;--fill:${fill}deg"></div>`}


function showDenominatorLab(){
 clearTask();
 setProgress();
 $('eyebrow').textContent='Gemeinsamer Nenner';
 promptEl.textContent='Brüche auf dieselbe Stückgröße bringen';
 subEl.textContent='Verändere die Teilung der beiden Pizzen und markiere Stücke. Die Brüche werden sofort angezeigt.';

 const lab=document.createElement('div');
 lab.className='denLearn';

 const intro=document.createElement('div');
 intro.className='denIntro';
 intro.textContent='Zum Addieren müssen beide Pizzen in gleich große Stücke gedacht werden. Der gemeinsame Nenner ist eine Teilung, zu der beide ursprünglichen Aufteilungen passen.';

 const editors=document.createElement('div');
 editors.className='fractionEditors';

 const plus=document.createElement('div');
 plus.className='bigPlus';
 plus.textContent='+';

 const left=createFractionEditor('Erster Bruch',2,1);
 const right=createFractionEditor('Zweiter Bruch',3,1);

 editors.append(left.el,plus,right.el);

 const equation=document.createElement('div');
 equation.className='liveEquation';

 const actions=document.createElement('div');
 actions.className='denActions';

 const commonBtn=document.createElement('button');
 commonBtn.className='primary';
 commonBtn.textContent='Gemeinsamen Nenner zeigen';

 const exampleBtn=document.createElement('button');
 exampleBtn.className='secondary';
 exampleBtn.textContent='Neue Beispielaufgabe';

 const panel=document.createElement('div');
 panel.className='commonPanel hidden';

 const tip=document.createElement('div');
 tip.className='parentTip';
 tip.innerHTML='<b>So kann man es erklären:</b> „Wir dürfen nur Stücke zusammenzählen, die gleich groß sind. Deshalb teilen wir beide Pizzen so fein, dass beide bisherigen Teilungen darin aufgehen. Die Menge bleibt dabei gleich – nur die Stücke werden kleiner.“';

 actions.append(commonBtn,exampleBtn);
 lab.append(intro,editors,equation,actions,panel,tip);
 stage.appendChild(lab);

 function updateEquation(){
   equation.innerHTML=`${frac(left.getNum(),left.getDen())} <span>+</span> ${frac(right.getNum(),right.getDen())}`;

 }
 left.onChange(updateEquation);
 right.onChange(updateEquation);
 updateEquation();

 commonBtn.onclick=()=>{
   const a=left.getNum(), b=left.getDen(), c=right.getNum(), d=right.getDen();
   const common=lcm(b,d);
   const aa=a*(common/b);

   const reduced=simp(total,common);

   panel.classList.remove('hidden');
   panel.innerHTML='';

   const title=document.createElement('div');
   title.className='commonTitle';
   title.textContent=`Gemeinsamer Nenner: ${common}`;

   const text=document.createElement('div');

   const conv=document.createElement('div');

   p.className='arrowEq';
   p.textContent='+';

   const box2=document.createElement('div');
   box2.className='convertBox';
   box2.innerHTML=`<div class="convertPizza">${svgPieHTML(cc,common,false)}</div><div class="convertFrac">${c}/${d} = ${cc}/${common}</div>`;

   const eq=document.createElement('div');
   eq.className='arrowEq';
   eq.textContent='=';

   const resultBox=document.createElement('div');
   resultBox.className='convertBox';
   resultBox.innerHTML=`<div class="convertFrac">${aa}/${common} + ${cc}/${common}</div><div class="convertFrac">= ${total}/${common}${(reduced[0]!==total||reduced[1]!==common)?` = ${reduced[0]}/${reduced[1]}`:''}</div>`;

   conv.append(box1,p,box2,eq,resultBox);
   panel.append(title,text,conv);
 };

 exampleBtn.onclick=()=>{
   const examples=[
     [2,1,3,1],
     [3,1,4,1],
     [4,1,6,1],
     [3,2,4,1],
     [5,2,3,1],
     [2,1,5,2]
   ];
   const e=pick(examples);
   left.set(e[0],e[1]);
   right.set(e[2],e[3]);
   updateEquation();
 };
}

function createFractionEditor(title,initialDen,initialNum){
 let den=initialDen;
 let selectedSet=new Set();
 for(let i=0;i<Math.min(initialNum,den);i++)selectedSet.add(i);
 let callback=()=>{};

 const el=document.createElement('div');
 el.className='frEditor';

 const titleEl=document.createElement('div');
 titleEl.className='frEditorTitle';
 titleEl.textContent=title;

 const pizza=document.createElement('div');
 pizza.className='frPizza';

 const live=document.createElement('div');
 live.className='frLive';

 const sliderWrap=document.createElement('div');
 sliderWrap.className='frSliderWrap';

 const slider=document.createElement('input');
 slider.className='frSlider';
 slider.type='range';
 slider.min='2';
 slider.max='8';
 slider.step='1';
 slider.value=String(den);
 slider.setAttribute('aria-label',title+' Teilung');

 const scale=document.createElement('div');
 scale.className='frSliderScale';
 scale.innerHTML='<span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>';

 sliderWrap.append(slider,scale);
 el.append(titleEl,pizza,live,sliderWrap);

 function render(){
   pizza.innerHTML='';
   const svgNS='http://www.w3.org/2000/svg';
   const svg=document.createElementNS(svgNS,'svg');
   svg.setAttribute('viewBox','0 0 200 200');
   svg.setAttribute('role','group');
   svg.setAttribute('aria-label',`${selectedSet.size} von ${den} Stücken markiert`);

   for(let i=0;i<den;i++){
     const path=document.createElementNS(svgNS,'path');
     path.setAttribute('d',sectorPath(100,100,92,i*360/den,(i+1)*360/den));
     path.setAttribute('class',selectedSet.has(i)?'on':'off');
     path.setAttribute('tabindex','0');
     path.setAttribute('role','button');
     path.setAttribute('aria-label',`Stück ${i+1}`);
     const toggle=()=>{
       if(selectedSet.has(i))selectedSet.delete(i);else selectedSet.add(i);
       render();
       callback();
     };
     path.addEventListener('click',toggle);
     path.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}});
     svg.appendChild(path);
   }
   pizza.appendChild(svg);
   live.innerHTML=frac(selectedSet.size,den);
 }

 slider.addEventListener('input',()=>{
   den=Number(slider.value);
   selectedSet=new Set();
   render();
   callback();
 });

 render();

 return {
   el,
   getNum:()=>selectedSet.size,
   getDen:()=>den,
   onChange:fn=>{callback=fn},
   set:(newDen,newNum)=>{
     den=Math.max(2,Math.min(8,newDen));
     slider.value=String(den);
     selectedSet=new Set();
     for(let i=0;i<Math.min(newNum,den);i++)selectedSet.add(i);
     render();
     callback();
   }
 };
}

function sectorPath(cx,cy,r,startDeg,endDeg){
 const rad=a=>(a-90)*Math.PI/180;
 const x1=cx+r*Math.cos(rad(startDeg));
 const y1=cy+r*Math.sin(rad(startDeg));
 const x2=cx+r*Math.cos(rad(endDeg));
 const y2=cy+r*Math.sin(rad(endDeg));
 const large=(endDeg-startDeg)>180?1:0;
 return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
}

function svgPieHTML(n,d){
 let paths='';
 for(let i=0;i<d;i++){
   paths+=`<path class="${i<n?'on':''}" d="${sectorPath(100,100,92,i*360/d,(i+1)*360/d)}"></path>`;
 }
 return `<svg viewBox="0 0 200 200" aria-hidden="true">${paths}</svg>`;
}
